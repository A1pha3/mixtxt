# 占位域名：仅用于本地构建。部署时须用 --base-url 覆盖真实域名
# （build.sh 透传 "$@"，Cloudflare Pages 传 --base-url "$CF_PAGES_URL"）。
base_url = "https://mixtxt.com"
title = "Mixtxt · AI 改编小说"
description = "AI 辅助改编小说的单作者阅读站"
default_language = "zh"
author = "matrix"

compile_sass = true
build_search_index = false
generate_feeds = true
generate_sitemap = true
minify_html = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
]

[markdown.highlighting]
theme = "github-dark"

[extra]
copyright = "本作以公有领域文本《三国演义》（罗贯中）为底本进行科幻向二次创作，原著相关情节与人物已进入公共领域；其余科幻设定与改写内容版权归改编作者所有。涉及任何非公有领域素材的部分仅作私人草稿，不代表任何授权。"

# Google AdSense 自动广告配置
# client：官方广告代码中的完整 client 参数，必须带 ca-pub- 前缀（例如 ca-pub-3883067925168693）
# enabled：设为 false 即一键停用全站广告脚本
[extra.ads]
client = "ca-pub-3883067925168693"
enabled = true

# Google Analytics 4 (gtag.js) 配置
# gtag：GA4 衡量 ID，格式 G-XXXXXXXXXX；enabled 设为 false 即一键停用全站统计
[extra.analytics]
gtag = "G-V3X2ER5GNF"
enabled = true