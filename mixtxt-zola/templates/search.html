{% extends "base.html" %}
{% block title %}搜索 - {{ config.title }}{% endblock %}
{% block content %}
<h1>搜索</h1>
<input id="q" type="search" aria-label="搜索关键词" placeholder="搜索章节标题或正文…">
<ul id="results"></ul>
{% endblock %}
{% block scripts %}
<script>
let pagefindPromise;
function getPagefind() {
  // 根相对路径：pagefind 索引与站点同根（Cloudflare Pages / 本地 serve 均成立），
  // 不依赖 base_url，避免 get_url 生成占位域名绝对 URL 导致本地预览搜索失效。
  pagefindPromise ||= import("/pagefind/pagefind.js");
  return pagefindPromise;
}
let seq = 0;
async function doSearch(term) {
  let box = document.getElementById("results");
  term = term.trim();
  if (!term) { box.replaceChildren(); return; }
  let my = ++seq;
  let pagefind;
  try {
    pagefind = await getPagefind();
  } catch (e) {
    box.innerHTML = "<li>搜索索引不可用，请稍后重试。</li>";
    return;
  }
  let result = await pagefind.search(term);
  if (my !== seq) return;
  box.replaceChildren();
  if (!result.results.length) {
    box.innerHTML = "<li>未找到匹配结果。</li>";
    return;
  }
  for (let r of result.results.slice(0, 20)) {
    let data = await r.data();
    let li = document.createElement("li");
    let a = document.createElement("a");
    a.href = data.url;
    a.textContent = data.meta.title;
    li.append(a);
    if (data.content) {
      let doc = new DOMParser().parseFromString(data.content, "text/html");
      let p = document.createElement("p");
      p.className = "excerpt";
      p.textContent = doc.body ? doc.body.textContent.slice(0, 80) : "";
      li.append(p);
    }
    box.append(li);
  }
}
let debounceTimer;
document.getElementById("q").addEventListener("input", function(e) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function() { doSearch(e.target.value); }, 150);
});
</script>
{% endblock %}
